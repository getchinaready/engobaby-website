<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>月卡预约 · 英歌派 Engo Pro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#F4A81B; --gold-d:#C4820A; --gold-l:#FDF2DC;
    --red:#EF5A5A; --grn:#7CB24E; --blu:#3E92DE;
    --navy:#16456F; --navy-l:#2E7CC0; --navy-d:#0E2E4D;
    --ink:#33302B; --mut:#9A8F82; --line:#EDE4D6;
    --cream:#FBF5EC; --card:#FFFDF9;
    --fz:"Poppins","Noto Sans SC",system-ui,sans-serif;
    --fh:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--fz);background:var(--cream);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  h1,h2,h3{font-family:var(--fh);line-height:1.22}
  .page{max-width:600px;margin:0 auto;padding-bottom:60px}

  /* ═══ 顶部 ═══ */
  .hd{color:var(--ink);padding:22px 20px 46px;position:relative;overflow:hidden;
    border-radius:0 0 30px 30px;
    background:
      radial-gradient(circle 5px at 11% 16%, rgba(239,90,90,.45) 97%, transparent 100%),
      radial-gradient(circle 4px at 30% 7%,  rgba(124,178,78,.5) 97%, transparent 100%),
      radial-gradient(circle 6px at 88% 12%, rgba(244,168,27,.5) 97%, transparent 100%),
      radial-gradient(circle 4px at 68% 5%,  rgba(62,146,222,.45) 97%, transparent 100%),
      radial-gradient(circle 3px at 50% 13%, rgba(239,90,90,.35) 97%, transparent 100%),
      radial-gradient(circle 4px at 94% 40%, rgba(124,178,78,.4) 97%, transparent 100%),
      radial-gradient(circle 3px at 5% 45%,  rgba(62,146,222,.4) 97%, transparent 100%),
      linear-gradient(165deg,#FFF6E1 0%,#FDF1E8 46%,#E9F3FE 100%)}
  .hd::before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;
    background:rgba(62,146,222,.10);right:-80px;top:-70px}
  .hd::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;
    background:rgba(244,168,27,.13);left:-70px;bottom:-60px}
  .hd .row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative;z-index:2}
  .hlogo{height:26px;display:block;margin-bottom:9px}
  .hd .t{font-size:1.35rem;font-weight:800;font-family:var(--fh);letter-spacing:.01em;color:var(--ink)}
  .hd .t em{font-style:normal;color:var(--blu)}
  .hd .sub{font-size:.78rem;color:#8C8174;margin-top:1px}
  .who{background:#fff;border:2px solid #F0E4D0;color:var(--navy);
    border-radius:999px;padding:7px 14px;font-size:.83rem;font-weight:700;font-family:var(--fz);
    cursor:pointer;white-space:nowrap;max-width:42vw;overflow:hidden;text-overflow:ellipsis;flex:none;
    box-shadow:0 2px 8px rgba(51,48,43,.07)}

  /* 我的本月 */
  .hero{position:relative;z-index:2;margin-top:14px;background:#fff;
    border:2px solid #F3E8D5;border-radius:18px;padding:15px 17px;
    box-shadow:0 4px 14px rgba(51,48,43,.06)}
  .hero .big{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
  .hero .big b{font-family:var(--fh);font-size:2.5rem;font-weight:800;line-height:1;
    background:linear-gradient(100deg,var(--red),var(--gold) 40%,var(--grn) 75%,var(--blu));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .big span{font-size:.88rem;color:#6E6357;font-weight:600}
  .bar{height:9px;background:#F3EDE2;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold) 38%,var(--grn) 72%,var(--blu));border-radius:99px;
    transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .hero .cap{font-size:.73rem;color:#A99E90;margin-top:7px}

  /* ═══ 规则条 ═══ */
  .note{margin:14px 16px 0;position:relative;z-index:3;background:var(--card);
    border-radius:16px;padding:14px 16px;font-size:.8rem;color:#6E6357;line-height:1.72;
    box-shadow:0 6px 20px rgba(51,48,43,.09)}
  .note b{color:var(--navy)}
  .note .hl{background:var(--gold-l);color:var(--gold-d);padding:1px 6px;border-radius:5px;font-weight:700}

  /* ═══ 周分隔 ═══ */
  .wk{display:flex;align-items:center;gap:10px;margin:26px 18px 12px}
  .wk b{font-family:var(--fh);font-size:.9rem;color:var(--navy);font-weight:700;white-space:nowrap}
  .wk i{flex:1;height:2px;background:var(--line);border-radius:2px}
  .wk em{font-style:normal;font-size:.72rem;color:var(--mut);font-weight:600;white-space:nowrap}

  /* ═══ 日卡 ═══ */
  .day{background:var(--card);border-radius:19px;margin:0 16px 12px;overflow:hidden;
    box-shadow:0 3px 14px rgba(51,48,43,.07);position:relative;transition:box-shadow .18s}
  .day::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ac,#2E7CC0)}
  .day.on{box-shadow:0 6px 22px rgba(244,168,27,.28)}
  .day.on::before{background:var(--gold);width:8px}
  .day.br{background:#F4EFE7;box-shadow:none;opacity:.85}
  .day.br::before{background:#DDD3C6}
  .day.shut::before{opacity:.35}
  .dh{display:flex;gap:13px;padding:15px 15px 15px 19px;cursor:pointer;align-items:flex-start}
  .day.br .dh{cursor:default}
  .dt{flex:none;width:54px;text-align:center;padding-top:1px}
  .dt .n{font-family:var(--fh);font-size:1.95rem;font-weight:800;color:var(--ac,#2E7CC0);line-height:.95}
  .dt .w{font-size:.7rem;color:var(--mut);margin-top:3px;font-weight:600}
  .day.br .dt .n,.day.shut .dt .n{color:#BDB2A4}
  .dc{flex:1;min-width:0}
  .dc .en{font-size:1rem;font-weight:700;color:var(--ink);line-height:1.3;letter-spacing:-.01em}
  .dc .cn{font-size:.82rem;color:var(--mut);margin-top:2px}
  .day.br .dc .en,.day.shut .dc .en{color:#A99E90;font-weight:600}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  .pill{font-size:.71rem;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap}
  .pill.time{background:#F1F5F9;color:#5C6B7A}
  .pill.shut{background:#EDE7DE;color:#A99E90}
  .pill.grace{background:#E9F5E4;color:#4A7F3C}
  .pill.me{background:var(--gold);color:#4A3B12;box-shadow:0 2px 6px rgba(244,168,27,.35)}
  .heat{display:inline-flex;align-items:center;gap:3px;font-size:.71rem;font-weight:700;
    background:#FDF0E8;color:#C25A28;padding:4px 10px;border-radius:8px}
  .caret{flex:none;align-self:center;color:#CFC5B7;font-size:1.2rem;transition:transform .22s;font-family:var(--fh)}
  .day.open .caret{transform:rotate(90deg)}

  /* 迷你头像堆 */
  .stack{display:inline-flex;align-items:center;margin-left:2px}
  .stack .m{width:21px;height:21px;border-radius:50%;border:2px solid var(--card);
    margin-left:-7px;display:grid;place-items:center;color:#fff;font-size:.6rem;font-weight:800}
  .stack .m:first-child{margin-left:0}

  /* ═══ 展开区 ═══ */
  .bd{display:none;border-top:1.5px dashed var(--line);padding:16px 16px 18px 19px;background:rgba(251,245,236,.5)}
  .day.open .bd{display:block}
  .lb{font-size:.77rem;font-weight:800;color:var(--mut);margin-bottom:9px}
  .lb span{font-weight:600;color:#B7AC9E}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:17px}
  .opt{border:2px solid var(--line);background:var(--card);border-radius:13px;padding:9px 14px;
    font-size:.87rem;font-weight:700;color:var(--ink);cursor:pointer;font-family:var(--fz);
    transition:.14s;position:relative}
  .opt small{display:block;font-size:.71rem;color:var(--mut);font-weight:500;margin-top:1px}
  .opt.sel{border-color:var(--navy-l);background:#EAF3FB;color:var(--navy)}
  .opt.sel small{color:#5C87AB}
  .opt.sel::after{content:"✓";position:absolute;top:-8px;right:-7px;width:19px;height:19px;
    background:var(--navy-l);color:#fff;border-radius:50%;font-size:.66rem;display:grid;place-items:center;
    border:2px solid var(--card)}
  .opt.st.sel{border-color:var(--gold);background:var(--gold-l);color:var(--gold-d)}
  .opt.st.sel::after{background:var(--gold)}
  .opt.md.sel{border-color:var(--grn);background:#EFF7E6;color:#4A7F3C}
  .opt.md.sel::after{background:var(--grn)}
  .tip{font-size:.74rem;color:#9A8F82;background:#F4EFE7;border-radius:9px;padding:8px 11px;
    margin:-9px 0 16px;line-height:1.55}

  .go{width:100%;background:linear-gradient(135deg,#F4A81B,#E09400);color:#fff;border:none;
    border-radius:14px;padding:14px;font-size:1.04rem;font-weight:800;font-family:var(--fh);
    cursor:pointer;box-shadow:0 7px 18px rgba(244,168,27,.32);letter-spacing:.02em}
  .go:disabled{opacity:.45;box-shadow:none}
  .go.cancel{background:none;color:#B05B4C;border:2px solid #EBD6D0;box-shadow:none;margin-top:9px;
    font-size:.88rem;padding:10px;font-family:var(--fz);font-weight:700}

  /* ═══ 同场的人 ═══ */
  .ppl{margin-top:17px;padding-top:15px;border-top:1.5px dashed var(--line)}
  .grp{margin-bottom:14px}
  .grp:last-child{margin-bottom:0}
  .gt{font-size:.79rem;font-weight:800;color:var(--navy);margin-bottom:9px;display:flex;
    align-items:center;gap:7px}
  .gt em{font-style:normal;color:var(--mut);font-weight:600;font-size:.74rem}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .p{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;
    padding:5px 14px 5px 5px;font-size:.85rem;font-weight:700;box-shadow:0 2px 7px rgba(51,48,43,.07)}
  .p.self{background:var(--gold-l);box-shadow:inset 0 0 0 2px var(--gold)}
  .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    color:#fff;font-size:.8rem;font-weight:800;flex:none;font-family:var(--fh)}
  .p em{font-style:normal;font-size:.77rem;color:var(--mut);font-weight:600}
  .empty{font-size:.82rem;color:var(--mut);padding:3px 0}

  /* ═══ 顺延 ═══ */
  .pend{margin:28px 16px 0;background:var(--card);border-radius:19px;padding:18px 19px;
    box-shadow:0 3px 14px rgba(51,48,43,.07);border:2px dashed var(--line)}
  .pend h3{font-size:1rem;margin-bottom:3px;color:var(--navy)}
  .pend .s{font-size:.77rem;color:var(--mut);margin-bottom:12px}
  .pend li{list-style:none;font-size:.85rem;padding:8px 0;border-top:1px solid var(--line);color:#6E6357}
  .pend li b{color:var(--ink);font-weight:700}

  .foot{text-align:center;font-size:.75rem;color:#B0A597;margin-top:30px;line-height:1.9;padding:0 20px}

  /* ═══ 弹窗 / 提示 ═══ */
  .veil{position:fixed;inset:0;background:rgba(14,46,77,.6);display:none;z-index:60;
    align-items:center;justify-content:center;padding:24px}
  .veil.on{display:flex}
  .box{background:var(--card);border-radius:24px;padding:28px 24px;width:100%;max-width:360px;
    box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .box .ic{font-size:2.4rem;text-align:center;margin-bottom:10px}
  .box h3{font-size:1.2rem;margin-bottom:7px;text-align:center}
  .box p{font-size:.84rem;color:var(--mut);margin-bottom:17px;line-height:1.65;text-align:center}
  .box input{width:100%;font-size:16px;font-family:var(--fz);border:2px solid var(--line);
    border-radius:13px;padding:13px;margin-bottom:14px;text-align:center;font-weight:700}
  .box input:focus{outline:none;border-color:var(--gold)}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(22px);
    background:rgba(22,69,111,.97);color:#fff;padding:14px 26px;border-radius:999px;
    font-size:.9rem;font-weight:700;z-index:90;opacity:0;transition:.26s;pointer-events:none;
    max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .load{text-align:center;padding:70px 24px;color:var(--mut);font-size:.9rem;line-height:1.8}


  .first{margin-top:-24px !important}
  .quote{position:relative;z-index:2;margin-top:15px;font-family:var(--fh);
    font-size:.97rem;font-weight:800;color:var(--navy);line-height:1.5;letter-spacing:.01em;
    background:rgba(255,255,255,.72);border-radius:14px;padding:11px 14px;
    border-left:5px solid var(--gold);box-shadow:0 2px 8px rgba(51,48,43,.05)}
  .quote span{display:block;font-family:var(--fz);font-size:.72rem;font-weight:600;
    color:#A99E90;margin-top:2px}

  /* 代号 & 我的预约 */
  .codebar{font-size:.72rem;color:#A99E90;margin-top:8px}
  .codebar b{color:var(--gold-d);font-family:var(--fh);letter-spacing:.03em}
  .mybox{position:relative;z-index:3;margin:14px 16px 0;background:var(--card);border-radius:19px;padding:15px 17px;
    box-shadow:0 3px 14px rgba(51,48,43,.07)}
  .mybox h3{font-size:.95rem;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .myrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
  .myrow .md{flex:none;width:44px;text-align:center;background:var(--gold-l);border-radius:11px;padding:5px 0}
  .myrow .md b{display:block;font-family:var(--fh);font-size:1.15rem;color:var(--gold-d);line-height:1.1}
  .myrow .md span{font-size:.62rem;color:#B7935A;font-weight:700}
  .myrow .mi{flex:1;min-width:0}
  .myrow .mi b{display:block;font-size:.85rem;font-weight:700;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .myrow .mi span{font-size:.73rem;color:var(--mut)}
  .cal{flex:none;background:#EAF3FB;color:var(--navy);border:none;border-radius:10px;
    padding:8px 12px;font-size:.76rem;font-weight:800;font-family:var(--fz);
    text-decoration:none;white-space:nowrap}
  .mytip{font-size:.7rem;color:#B0A597;margin-top:9px;line-height:1.55}
  .callink{display:inline-block;margin-top:11px;background:#EAF3FB;color:var(--navy);
    border-radius:10px;padding:8px 14px;font-size:.78rem;font-weight:800;text-decoration:none}

  /* 弹窗里的代号卡 / 候选按钮 */
  .codecard{background:linear-gradient(135deg,#16456F,#2E7CC0);border-radius:16px;
    padding:18px;text-align:center;margin-bottom:14px}
  .codecard .cl{font-size:.72rem;color:#9FC4E6;letter-spacing:.12em;margin-bottom:5px}
  .codecard .cv{font-family:var(--fh);font-size:1.7rem;font-weight:800;color:var(--gold);letter-spacing:.02em}
  .copybtn{margin-top:11px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);
    color:#fff;border-radius:999px;padding:7px 20px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:var(--fz)}
  .cand{width:100%;border:2px solid var(--line);background:var(--card);border-radius:13px;
    padding:12px;font-size:.9rem;font-weight:700;color:var(--ink);cursor:pointer;
    font-family:var(--fz);margin-bottom:9px;text-align:center}
  .cand b{color:var(--navy)}
  .cand.new{border-style:dashed;color:var(--gold-d)}
  .boxmsg{font-size:.8rem;color:#B05B4C;text-align:center;margin:-8px 0 12px;display:none}
  .boxmsg.on{display:block}

  /* 撒花 */
  .cf{position:fixed;pointer-events:none;z-index:80;width:9px;height:14px;border-radius:2px;top:-20px}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="page" id="page"><div class="load">正在载入课表…</div></div>

<div class="veil" id="veil">
  <div class="box" id="boxEnter">
    <div class="ic">⛵️</div>
    <h3 id="enterTitle">欢迎！你是哪位？</h3>
    <p id="enterHint">第一次来：输入<b>英文名</b>，系统会发你一个专属代号。<br>已有代号：直接输入代号（如 engo-lily）。</p>
    <div class="boxmsg" id="enterMsg"></div>
    <input type="text" id="enterInput" placeholder="英文名 或 代号" maxlength="30" autocapitalize="off">
    <button class="go" id="enterGo">进入</button>
    <div id="candWrap" style="margin-top:14px"></div>
  </div>
  <div class="box" id="boxCode" style="display:none">
    <div class="ic">🎉</div>
    <h3>这是你的专属代号</h3>
    <p>已经帮这台手机记住了。<b>换手机时输入这个代号</b>，就能回到你自己的预约。建议截图或存到微信收藏。</p>
    <div class="codecard"><div class="cl">MY ENGO CODE</div>
      <div class="cv" id="codeShow"></div>
      <button class="copybtn" id="codeCopy">复制代号</button></div>
    <button class="go" id="codeDone">开始预约 →</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var K = new URLSearchParams(location.search).get('k') || '';
  var LS_CODE='engo_yueka_code', LS_NAME='engo_yueka_name';
  var myCode='', myName='';
  try { myCode=localStorage.getItem(LS_CODE)||''; myName=localStorage.getItem(LS_NAME)||''; } catch(e){}

  var D=null, openDate=null, pick={};
  var page=document.getElementById('page'), veil=document.getElementById('veil'), toastEl=document.getElementById('toast');

  var QUOTES=[
    ["You don't need perfect English — you just need to start.",'不用完美，先开口'],
    ['Every word you speak is a step forward.','每开口一次，就前进一步'],
    ['Small talk today, big talk tomorrow.','今天敢闲聊，明天敢演讲'],
    ['Consistency beats intensity.','常来，比猛学更管用'],
    ['One topic a day keeps the silence away.','每天一个主题，告别哑巴英语'],
    ['Your accent is your story. Own it.','口音是你的故事，大方说'],
    ['Show up. That is 80% of learning.','来了，就赢了八成'],
    ['Mistakes mean you are trying.','说错了，说明你在认真练'],
    ['Speak badly today, speak boldly tomorrow.','今天说得烂，明天说得敢'],
    ['English is not a test. It is a door.','英语不是考试，是一扇门'],
    ['The best time to speak up is now.','最好的开口时机，就是现在'],
    ['Little by little, a little becomes a lot.','一点一点，就会很多'],
    ['Done is better than perfect.','说出来，比说得完美更重要'],
    ['Your future self will thank you for today.','未来的你，会感谢今天来的你']];
  var QUOTE=QUOTES[Math.floor(Math.random()*QUOTES.length)];

  var ACC=['#2E7CC0','#E0703F','#5C9E4A','#C4820A','#7B5FC4','#2FA8A0','#D4506B'];
  var AV =['#3090D8','#EF4A4A','#7BA84A','#F4A81B','#8A63C4','#2FA8A0','#E07A3F','#5C7CB8'];
  function hash(x){var h=0;for(var i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))>>>0;return h;}
  function avColor(n){return AV[hash(n)%AV.length];}
  function initial(n){return (n||'?').trim().charAt(0).toUpperCase();}
  function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  var tT;
  function toast(m){toastEl.textContent=m;toastEl.classList.add('on');
    clearTimeout(tT);tT=setTimeout(function(){toastEl.classList.remove('on');},3000);}

  function confetti(){
    var C=['#F4A81B','#EF4A4A','#7BA84A','#3090D8','#FFD275'];
    for(var i=0;i<26;i++){(function(i){
      var el=document.createElement('div');el.className='cf';
      el.style.left=(Math.random()*100)+'vw';el.style.background=C[i%C.length];
      el.style.animation='fall '+(1.5+Math.random()*1.1)+'s '+(Math.random()*.3)+'s ease-in forwards';
      document.body.appendChild(el);setTimeout(function(){el.remove();},3200);
    })(i);}
  }
  function copyText(t,btn,okLabel){
    function done(){btn.textContent=okLabel;setTimeout(function(){btn.textContent='复制代号';},2000);}
    function legacy(){var ta=document.createElement('textarea');ta.value=t;
      ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);}
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,legacy);
    else legacy();
  }

  // ---------- 登录 / 注册 ----------
  var boxEnter=document.getElementById('boxEnter'), boxCode=document.getElementById('boxCode');
  var enterMsg=document.getElementById('enterMsg'), candWrap=document.getElementById('candWrap');

  function askEnter(switching){
    boxEnter.style.display='block'; boxCode.style.display='none';
    candWrap.innerHTML=''; enterMsg.classList.remove('on');
    document.getElementById('enterTitle').textContent = switching ? '切换 / 找回账号' : '欢迎！你是哪位？';
    document.getElementById('enterHint').innerHTML = switching
      ? '当前：<b>'+esc(myName)+'</b>（'+esc(myCode)+'）。<br>输入别的代号可切换；输入新英文名会创建新代号。'
      : '第一次来：输入<b>英文名</b>，系统会发你一个专属代号。<br>已有代号：直接输入代号（如 engo-lily）。';
    document.getElementById('enterInput').value='';
    veil.classList.add('on');
    setTimeout(function(){document.getElementById('enterInput').focus();},80);
  }
  function showMsg(m){enterMsg.textContent=m;enterMsg.classList.add('on');}
  function saveMe(code,name){
    myCode=code; myName=name;
    try{localStorage.setItem(LS_CODE,code);localStorage.setItem(LS_NAME,name);}catch(e){}
  }
  function doEnter(confirmNew){
    var v=document.getElementById('enterInput').value.trim();
    if(!v){showMsg('先输入名字或代号～');return;}
    var btn=document.getElementById('enterGo');
    btn.disabled=true;btn.textContent='稍等…';
    fetch('/api/yueka',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({k:K,action:'enter',name:v,confirmNew:!!confirmNew})})
      .then(function(r){return r.json();})
      .then(function(j){
        btn.disabled=false;btn.textContent='进入';
        if(!j.ok){showMsg(j.message||j.error||'出错了，再试一次');return;}
        if(j.mode==='login'){saveMe(j.code,j.name);veil.classList.remove('on');
          toast('欢迎回来，'+j.name+' 👋');refresh();return;}
        if(j.mode==='created'){saveMe(j.code,j.name);
          boxEnter.style.display='none';boxCode.style.display='block';
          document.getElementById('codeShow').textContent=j.code;confetti();return;}
        if(j.mode==='conflict'){
          candWrap.innerHTML='<div class="lb" style="text-align:center">已经有人用这个名字了 —— 是你本人吗？</div>'+
            j.candidates.map(function(c){
              return '<button class="cand" data-c="'+esc(c.code)+'" data-n="'+esc(c.name)+'">是我，我是 <b>'+
                esc(c.name)+'</b>（'+esc(c.code)+'）</button>';}).join('')+
            '<button class="cand new" id="candNew">我是新来的，给我新代号 <b>'+esc(j.suggest)+'</b></button>';
          candWrap.querySelectorAll('[data-c]').forEach(function(el){
            el.addEventListener('click',function(){
              saveMe(el.getAttribute('data-c'),el.getAttribute('data-n'));
              veil.classList.remove('on');toast('欢迎回来，'+el.getAttribute('data-n')+' 👋');refresh();});});
          document.getElementById('candNew').addEventListener('click',function(){doEnter(true);});
        }
      })
      .catch(function(){btn.disabled=false;btn.textContent='进入';showMsg('网络不太顺，再试一次');});
  }
  document.getElementById('enterGo').addEventListener('click',function(){doEnter(false);});
  document.getElementById('enterInput').addEventListener('keydown',function(e){
    if(e.key==='Enter') doEnter(false);});
  document.getElementById('codeCopy').addEventListener('click',function(){
    copyText(myCode,this,'已复制 ✓');});
  document.getElementById('codeDone').addEventListener('click',function(){
    veil.classList.remove('on');refresh();});

  // ---------- 载入 ----------
  function api(){return '/api/yueka?k='+encodeURIComponent(K)+'&me='+encodeURIComponent(myCode);}
  function load(){
    fetch(api()).then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
      .then(function(x){
        if(x.s===403){page.innerHTML='<div class="load"><div style="font-size:3rem;margin-bottom:16px">🔒</div>'+
          '<b style="color:#33302B;font-size:1.06rem">这是月卡会员专属链接</b><br><br>'+
          '请向老师索取带口令的预约链接<br>微信 <b style="color:#16456F">engo2026</b></div>';return;}
        if(!x.j.ok) throw new Error(x.j.error||'fail');
        D=x.j; if(!myCode) askEnter(false); render();
      })
      .catch(function(){page.innerHTML='<div class="load">载入失败了，下拉刷新重试。<br>一直不行请联系老师（微信 engo2026）。</div>';});
  }
  function refresh(){
    return fetch(api()).then(function(r){return r.json();})
      .then(function(j){if(j.ok){D=j;render();}});
  }

  // ---------- 渲染 ----------
  function icsUrl(date,slot){
    return '/api/yueka-ics?k='+encodeURIComponent(K)+'&date='+encodeURIComponent(date)+'&slot='+encodeURIComponent(slot);
  }
  function render(){
    if(!D) return;
    var mine=D.bookings.filter(function(b){return b.mine;});
    var future=mine.filter(function(b){return b.date>=D.today;});
    var target=25, pct=Math.min(100,Math.round(mine.length/target*100));

    var qt=QUOTE;

    var h='';
    h+='<div class="hd"><div class="row"><div>'+
       '<img class="hlogo" src="engo_pro_logo.png" alt="ENGO PRO">'+
       '<div class="t">'+(myName?'Hello, <em>'+esc(myName)+'</em> 👋':'月卡预约')+'</div>'+
       '<div class="sub">'+(myName?'What do you want to practice this week?':esc(D.label)+' · 每节 60 分钟')+'</div></div>'+
       '<button class="who" id="whoBtn">'+(myName?esc(myName):'我是谁？')+' ✎</button></div>'+
       '<div class="quote">“'+esc(qt[0])+'”<span>'+esc(qt[1])+'</span></div>'+
       '<div class="hero"><div class="big"><b>'+mine.length+'</b><span>场已约'+
       (future.length?'　·　接下来还有 '+future.length+' 场':'')+'</span></div>'+
       '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
       '<div class="cap">本月 25 个主题日 · 每来一场，进度条就亮一格 ✨</div>'+
       (myCode?'<div class="codebar">我的代号 <b>'+esc(myCode)+'</b> · 换手机时用它找回预约</div>':'')+
       '</div></div>';

    // 我的预约
    if(future.length){
      var WD=['周日','周一','周二','周三','周四','周五','周六'];
      h+='<div class="mybox first"><h3>📌 我的预约</h3>';
      future.forEach(function(b){
        var d=D.days.filter(function(x){return x.date===b.date;})[0]||{};
        var dt=new Date(b.date+'T00:00:00');
        h+='<div class="myrow"><div class="md"><b>'+dt.getDate()+'</b><span>'+
           (dt.getMonth()+1)+'月·'+WD[dt.getDay()]+'</span></div>'+
           '<div class="mi"><b>'+esc(d.en||'')+'</b><span>'+esc(D.slots[b.slot].name)+' '+
           esc(D.slots[b.slot].time)+(function(){
             var st=D.statuses.filter(function(y){return y.key===b.status;})[0];
             var md=(D.moods||[]).filter(function(y){return y.key===b.mood;})[0];
             var t=(st?' · '+st.emoji:'')+(md?' '+md.emoji:'');return t;})()+'</span></div>'+
           '<a class="cal" href="'+icsUrl(b.date,b.slot)+'">📅 加日历</a></div>';
      });
      if(future.length>1){
        var ev=future.map(function(b){return b.date.replace(/-/g,'')+'-'+b.slot;}).join(',');
        h+='<div style="text-align:center;margin-top:11px"><a class="callink" href="/api/yueka-ics?k='+
           encodeURIComponent(K)+'&ev='+encodeURIComponent(ev)+
           '">📅 一键把 '+future.length+' 场全部加进日历</a></div>';
      }
      h+='<div class="mytip">💡 加进手机日历后，每场开课前 1 小时自动提醒。'+
         '微信里如果点了没反应，右上角 ··· 选「在浏览器中打开」再点。</div></div>';
    }

    h+='<div class="note'+(future.length?'':' first')+'">'+esc(D.note)+'<br>'+
       '<b>预约规则：</b>9/1–9/6 <span class="hl">首周不限</span>随时可约；'+
       '<b>9/14 起需提前 '+D.leadDays+' 天</b>（9/14 的课 9/11 仍可约，9/12 起关闭）。</div>';

    var last=null;
    D.days.forEach(function(d){
      var wk=weekKey(d.date);
      if(wk.key!==last){h+='<div class="wk"><b>'+wk.label+'</b><i></i><em>'+wk.tag+'</em></div>';last=wk.key;}
      h+=dayCard(d);
    });

    if(D.pending&&D.pending.length){
      h+='<div class="pend"><h3>顺延补足 · 另外 5 个主题</h3>'+
         '<div class="s">日期与时段会结合大家的时间统一安排，定了就加进来</div><ul>';
      D.pending.forEach(function(x){h+='<li><b>'+esc(x.en)+'</b> · '+esc(x.cn)+'</li>';});
      h+='</ul></div>';
    }
    h+='<div class="foot">英歌派 Engo Pro · 成人英语主题月卡<br>'+
       '有问题随时微信 engo2026<br>普宁市万泰新天地时代中心 D 栋</div>';

    page.innerHTML=h;
    document.getElementById('whoBtn').addEventListener('click',function(){askEnter(!!myCode);});
    bind();
  }

  function weekKey(ds){
    var d=new Date(ds+'T00:00:00');
    var mon=new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7));
    var sun=new Date(mon); sun.setDate(mon.getDate()+6);
    var f=function(x){return (x.getMonth()+1)+'/'+x.getDate();};
    var days=D.days.filter(function(x){var t=new Date(x.date+'T00:00:00');return t>=mon&&t<=sun;});
    var open=days.filter(function(x){return !x.break;}).length;
    return {key:f(mon),label:f(mon)+' – '+f(sun),tag:open?open+' 个主题日':'休课周'};
  }

  function dayCard(d){
    var WD=['周日','周一','周二','周三','周四','周五','周六'];
    var dt=new Date(d.date+'T00:00:00');
    var bs=D.bookings.filter(function(b){return b.date===d.date;});
    var myBk=bs.filter(function(b){return b.mine;});
    var ac=ACC[hash(d.en)%ACC.length];

    var cls='day';
    if(d.break) cls+=' br'; else if(!d.state.open) cls+=' shut';
    if(myBk.length) cls+=' on';
    if(openDate===d.date) cls+=' open';

    var h='<div class="'+cls+'" data-date="'+d.date+'" style="--ac:'+ac+'">';
    h+='<div class="dh" data-toggle="'+d.date+'">';
    h+='<div class="dt"><div class="n">'+dt.getDate()+'</div><div class="w">'+WD[dt.getDay()]+'</div></div>';
    h+='<div class="dc"><div class="en">'+esc(d.en)+'</div>';
    if(d.cn) h+='<div class="cn">'+esc(d.cn)+'</div>';

    h+='<div class="meta">';
    if(d.break){h+='<span class="pill shut">☕ 休课</span>';}
    else if(!d.state.open){h+='<span class="pill shut">'+esc(d.state.text)+'</span>';}
    else{
      (d.slots||[]).forEach(function(x){
        h+='<span class="pill time">'+esc(D.slots[x].name)+' '+esc(D.slots[x].time)+'</span>';});
      if(d.state.reason==='grace') h+='<span class="pill grace">首周不限</span>';
    }
    if(!d.break&&bs.length){
      h+='<span class="heat">'+(bs.length>=3?'🔥':'🙋')+' '+bs.length+' 人'+
         '<span class="stack">'+bs.slice(0,4).map(function(b){
           return '<span class="m" style="background:'+avColor(b.name)+'">'+esc(initial(b.name))+'</span>';
         }).join('')+'</span></span>';
    }
    if(myBk.length){
      h+='<span class="pill me">✓ 你约了 '+myBk.map(function(b){return D.slots[b.slot].name;}).join(' + ')+'</span>';
    }
    h+='</div></div>';
    if(!d.break) h+='<div class="caret">›</div>';
    h+='</div>';

    if(!d.break){
      h+='<div class="bd">';
      if(d.state.open){
        var sel=pick[d.date]||{};
        var curSlot=sel.slot||(myBk[0]?myBk[0].slot:(d.slots[0]||''));
        var curBk=myBk.filter(function(b){return b.slot===curSlot;})[0];
        var curSt=sel.status!==undefined?sel.status:(curBk?curBk.status:'');
        var curMd=sel.mood!==undefined?sel.mood:(curBk?curBk.mood:'');

        h+='<div class="lb">选时段 <span>· 一天想来两场也可以</span></div><div class="opts">';
        d.slots.forEach(function(x){
          var booked=myBk.filter(function(b){return b.slot===x;}).length>0;
          h+='<button class="opt'+(curSlot===x?' sel':'')+'" data-slot="'+d.date+'|'+x+'">'+
             esc(D.slots[x].name)+(booked?' ✓':'')+'<small>'+esc(D.slots[x].time)+'</small></button>';
        });
        h+='</div>';
        if(d.slots.length>1) h+='<div class="tip">💡 同一天两场<b>内容完全一样</b>，来一场就够；想加练也可以两场都约。</div>';

        h+='<div class="lb">今天想练什么？ <span>· 老师上课前会看到</span></div><div class="opts">';
        D.statuses.forEach(function(st){
          h+='<button class="opt st'+(curSt===st.key?' sel':'')+'" data-st="'+d.date+'|'+st.key+'">'+
             st.emoji+' '+esc(st.label)+'</button>';
        });
        h+='</div>';
        h+='<div class="lb">今天心情怎么样？ <span>· 选一个，让大家知道你来的状态</span></div><div class="opts">';
        (D.moods||[]).forEach(function(md){
          h+='<button class="opt md'+(curMd===md.key?' sel':'')+'" data-md="'+d.date+'|'+md.key+'">'+
             md.emoji+' '+esc(md.label)+'</button>';
        });
        h+='</div>';
        h+='<button class="go" data-book="'+d.date+'">'+(curBk?'更新这一场':'约 '+D.slots[curSlot].name)+'</button>';
        if(curBk){
          h+='<button class="go cancel" data-cancel="'+d.date+'">取消我的 '+D.slots[curSlot].name+'</button>';
          h+='<div style="text-align:center"><a class="callink" href="'+icsUrl(d.date,curSlot)+'">📅 把这场加进手机日历</a></div>';
        }
      } else {
        h+='<div class="empty">'+esc(d.state.text)+'，看看谁已经约了 👇</div>';
      }
      h+=peopleBlock(d,bs);
      h+='</div>';
    }
    return h+'</div>';
  }

  function peopleBlock(d,bs){
    var h='<div class="ppl">';
    if(!bs.length) return h+'<div class="empty">还没有人约这一天 —— 你可以是第一个 🌱</div></div>';
    (d.slots||[]).forEach(function(x){
      var list=bs.filter(function(b){return b.slot===x;});
      h+='<div class="grp"><div class="gt">'+esc(D.slots[x].name)+
         ' <em>'+esc(D.slots[x].time)+' · '+list.length+' 人</em></div>';
      if(!list.length){h+='<div class="empty">暂时没有人</div></div>';return;}
      h+='<div class="chips">';
      list.forEach(function(b){
        var st=D.statuses.filter(function(y){return y.key===b.status;})[0];
        var md=(D.moods||[]).filter(function(y){return y.key===b.mood;})[0];
        var tag=(md?md.emoji+' ':'')+(st?st.emoji+' '+esc(st.label):'');
        h+='<span class="p'+(b.mine?' self':'')+'">'+
           '<span class="av" style="background:'+avColor(b.name)+'">'+esc(initial(b.name))+'</span>'+
           esc(b.name)+(tag?' <em>'+tag+'</em>':'')+'</span>';
      });
      h+='</div></div>';
    });
    return h+'</div>';
  }

  // ---------- 交互 ----------
  function bind(){
    page.querySelectorAll('[data-toggle]').forEach(function(el){
      el.addEventListener('click',function(){
        var ds=el.getAttribute('data-toggle');
        var d=D.days.filter(function(x){return x.date===ds;})[0];
        if(d.break) return;
        openDate=(openDate===ds)?null:ds; render();
        if(openDate){var n=page.querySelector('[data-date="'+openDate+'"]');
          if(n) n.scrollIntoView({behavior:'smooth',block:'center'});}
      });
    });
    function pickSlot(date,cur){
      var d=D.days.filter(function(x){return x.date===date;})[0];
      return cur.slot||(D.bookings.filter(function(b){return b.date===date&&b.mine;})[0]||{}).slot||d.slots[0];
    }
    page.querySelectorAll('[data-slot]').forEach(function(el){
      el.addEventListener('click',function(){
        var q=el.getAttribute('data-slot').split('|');
        var cur=pick[q[0]]||{};
        pick[q[0]]={slot:q[1],status:cur.status,mood:cur.mood}; render();
      });
    });
    page.querySelectorAll('[data-st]').forEach(function(el){
      el.addEventListener('click',function(){
        var q=el.getAttribute('data-st').split('|');
        var cur=pick[q[0]]||{};
        pick[q[0]]={slot:pickSlot(q[0],cur),status:cur.status===q[1]?'':q[1],mood:cur.mood}; render();
      });
    });
    page.querySelectorAll('[data-md]').forEach(function(el){
      el.addEventListener('click',function(){
        var q=el.getAttribute('data-md').split('|');
        var cur=pick[q[0]]||{};
        pick[q[0]]={slot:pickSlot(q[0],cur),status:cur.status,mood:cur.mood===q[1]?'':q[1]}; render();
      });
    });
    page.querySelectorAll('[data-book]').forEach(function(el){
      el.addEventListener('click',function(){go(el.getAttribute('data-book'),false,el);});
    });
    page.querySelectorAll('[data-cancel]').forEach(function(el){
      el.addEventListener('click',function(){go(el.getAttribute('data-cancel'),true,el);});
    });
  }

  function go(date,cancel,btn){
    if(!myCode){askEnter(false);return;}
    var d=D.days.filter(function(x){return x.date===date;})[0];
    var sel=pick[date]||{};
    var myBk=D.bookings.filter(function(b){return b.date===date&&b.mine;});
    var slot=sel.slot||(myBk[0]?myBk[0].slot:(d.slots[0]||''));
    var cur=myBk.filter(function(b){return b.slot===slot;})[0];
    var status=sel.status!==undefined?sel.status:(cur?cur.status:'');
    var mood=sel.mood!==undefined?sel.mood:(cur?cur.mood:'');

    var body={k:K,code:myCode,date:date,slot:slot};
    if(cancel) body.action='cancel'; else {body.name=myName;body.status=status;body.mood=mood;}

    btn.disabled=true; var old=btn.textContent; btn.textContent='处理中…';
    fetch('/api/yueka',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json();})
      .then(function(j){
        if(!j.ok) throw new Error(j.error||'失败');
        if(cancel){toast('已取消 '+D.slots[slot].name);}
        else{toast('约好啦，'+D.slots[slot].name+' 见 👋');confetti();}
        delete pick[date];
        return refresh();
      })
      .catch(function(e){btn.disabled=false;btn.textContent=old;toast(e.message||'操作失败，请重试');});
  }

  load();
})();
</script>
