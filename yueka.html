<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>月卡预约 · 英歌派 Engo Pro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#F4A81B; --gold-d:#C4820A; --gold-l:#FDF2DC;
    --navy:#16456F; --navy-l:#2E7CC0; --navy-d:#0E2E4D;
    --ink:#33302B; --mut:#9A8F82; --line:#EDE4D6;
    --cream:#FBF5EC; --card:#FFFDF9;
    --fz:"Poppins","Noto Sans SC",system-ui,sans-serif;
    --fh:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--fz);background:var(--cream);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  h1,h2,h3{font-family:var(--fh);line-height:1.22}
  .page{max-width:600px;margin:0 auto;padding-bottom:60px}

  /* ═══ 顶部 ═══ */
  .hd{background:linear-gradient(150deg,#2E7CC0 0%,#16456F 58%,#0E2E4D 100%);
    color:#fff;padding:20px 20px 44px;position:relative;overflow:hidden;
    border-radius:0 0 30px 30px}
  .hd::after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;
    background:rgba(244,168,27,.13);right:-80px;top:-70px}
  .hd .row{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2}
  .hd .t{font-size:1.3rem;font-weight:800;font-family:var(--fh);letter-spacing:.01em}
  .hd .sub{font-size:.78rem;opacity:.8;margin-top:1px}
  .who{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.34);color:#fff;
    border-radius:999px;padding:7px 14px;font-size:.83rem;font-weight:700;font-family:var(--fz);
    cursor:pointer;white-space:nowrap;max-width:42vw;overflow:hidden;text-overflow:ellipsis;flex:none}

  /* 我的本月 */
  .hero{position:relative;z-index:2;margin-top:18px;background:rgba(255,255,255,.12);
    border:1.5px solid rgba(255,255,255,.2);border-radius:18px;padding:15px 17px}
  .hero .big{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
  .hero .big b{font-family:var(--fh);font-size:2.5rem;font-weight:800;color:var(--gold);line-height:1}
  .hero .big span{font-size:.88rem;opacity:.92;font-weight:600}
  .bar{height:9px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#F4A81B,#FFD275);border-radius:99px;
    transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .hero .cap{font-size:.73rem;opacity:.72;margin-top:7px}

  /* ═══ 规则条 ═══ */
  .note{margin:-24px 16px 0;position:relative;z-index:3;background:var(--card);
    border-radius:16px;padding:14px 16px;font-size:.8rem;color:#6E6357;line-height:1.72;
    box-shadow:0 6px 20px rgba(51,48,43,.09)}
  .note b{color:var(--navy)}
  .note .hl{background:var(--gold-l);color:var(--gold-d);padding:1px 6px;border-radius:5px;font-weight:700}

  /* ═══ 周分隔 ═══ */
  .wk{display:flex;align-items:center;gap:10px;margin:26px 18px 12px}
  .wk b{font-family:var(--fh);font-size:.9rem;color:var(--navy);font-weight:700;white-space:nowrap}
  .wk i{flex:1;height:2px;background:var(--line);border-radius:2px}
  .wk em{font-style:normal;font-size:.72rem;color:var(--mut);font-weight:600;white-space:nowrap}

  /* ═══ 日卡 ═══ */
  .day{background:var(--card);border-radius:19px;margin:0 16px 12px;overflow:hidden;
    box-shadow:0 3px 14px rgba(51,48,43,.07);position:relative;transition:box-shadow .18s}
  .day::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ac,#2E7CC0)}
  .day.on{box-shadow:0 6px 22px rgba(244,168,27,.28)}
  .day.on::before{background:var(--gold);width:8px}
  .day.br{background:#F4EFE7;box-shadow:none;opacity:.85}
  .day.br::before{background:#DDD3C6}
  .day.shut::before{opacity:.35}
  .dh{display:flex;gap:13px;padding:15px 15px 15px 19px;cursor:pointer;align-items:flex-start}
  .day.br .dh{cursor:default}
  .dt{flex:none;width:54px;text-align:center;padding-top:1px}
  .dt .n{font-family:var(--fh);font-size:1.95rem;font-weight:800;color:var(--ac,#2E7CC0);line-height:.95}
  .dt .w{font-size:.7rem;color:var(--mut);margin-top:3px;font-weight:600}
  .day.br .dt .n,.day.shut .dt .n{color:#BDB2A4}
  .dc{flex:1;min-width:0}
  .dc .en{font-size:1rem;font-weight:700;color:var(--ink);line-height:1.3;letter-spacing:-.01em}
  .dc .cn{font-size:.82rem;color:var(--mut);margin-top:2px}
  .day.br .dc .en,.day.shut .dc .en{color:#A99E90;font-weight:600}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  .pill{font-size:.71rem;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap}
  .pill.time{background:#F1F5F9;color:#5C6B7A}
  .pill.shut{background:#EDE7DE;color:#A99E90}
  .pill.grace{background:#E9F5E4;color:#4A7F3C}
  .pill.me{background:var(--gold);color:#4A3B12;box-shadow:0 2px 6px rgba(244,168,27,.35)}
  .heat{display:inline-flex;align-items:center;gap:3px;font-size:.71rem;font-weight:700;
    background:#FDF0E8;color:#C25A28;padding:4px 10px;border-radius:8px}
  .caret{flex:none;align-self:center;color:#CFC5B7;font-size:1.2rem;transition:transform .22s;font-family:var(--fh)}
  .day.open .caret{transform:rotate(90deg)}

  /* 迷你头像堆 */
  .stack{display:inline-flex;align-items:center;margin-left:2px}
  .stack .m{width:21px;height:21px;border-radius:50%;border:2px solid var(--card);
    margin-left:-7px;display:grid;place-items:center;color:#fff;font-size:.6rem;font-weight:800}
  .stack .m:first-child{margin-left:0}

  /* ═══ 展开区 ═══ */
  .bd{display:none;border-top:1.5px dashed var(--line);padding:16px 16px 18px 19px;background:rgba(251,245,236,.5)}
  .day.open .bd{display:block}
  .lb{font-size:.77rem;font-weight:800;color:var(--mut);margin-bottom:9px}
  .lb span{font-weight:600;color:#B7AC9E}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:17px}
  .opt{border:2px solid var(--line);background:var(--card);border-radius:13px;padding:9px 14px;
    font-size:.87rem;font-weight:700;color:var(--ink);cursor:pointer;font-family:var(--fz);
    transition:.14s;position:relative}
  .opt small{display:block;font-size:.71rem;color:var(--mut);font-weight:500;margin-top:1px}
  .opt.sel{border-color:var(--navy-l);background:#EAF3FB;color:var(--navy)}
  .opt.sel small{color:#5C87AB}
  .opt.sel::after{content:"✓";position:absolute;top:-8px;right:-7px;width:19px;height:19px;
    background:var(--navy-l);color:#fff;border-radius:50%;font-size:.66rem;display:grid;place-items:center;
    border:2px solid var(--card)}
  .opt.st.sel{border-color:var(--gold);background:var(--gold-l);color:var(--gold-d)}
  .opt.st.sel::after{background:var(--gold)}
  .tip{font-size:.74rem;color:#9A8F82;background:#F4EFE7;border-radius:9px;padding:8px 11px;
    margin:-9px 0 16px;line-height:1.55}

  .go{width:100%;background:linear-gradient(135deg,#F4A81B,#E09400);color:#fff;border:none;
    border-radius:14px;padding:14px;font-size:1.04rem;font-weight:800;font-family:var(--fh);
    cursor:pointer;box-shadow:0 7px 18px rgba(244,168,27,.32);letter-spacing:.02em}
  .go:disabled{opacity:.45;box-shadow:none}
  .go.cancel{background:none;color:#B05B4C;border:2px solid #EBD6D0;box-shadow:none;margin-top:9px;
    font-size:.88rem;padding:10px;font-family:var(--fz);font-weight:700}

  /* ═══ 同场的人 ═══ */
  .ppl{margin-top:17px;padding-top:15px;border-top:1.5px dashed var(--line)}
  .grp{margin-bottom:14px}
  .grp:last-child{margin-bottom:0}
  .gt{font-size:.79rem;font-weight:800;color:var(--navy);margin-bottom:9px;display:flex;
    align-items:center;gap:7px}
  .gt em{font-style:normal;color:var(--mut);font-weight:600;font-size:.74rem}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .p{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;
    padding:5px 14px 5px 5px;font-size:.85rem;font-weight:700;box-shadow:0 2px 7px rgba(51,48,43,.07)}
  .p.self{background:var(--gold-l);box-shadow:inset 0 0 0 2px var(--gold)}
  .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    color:#fff;font-size:.8rem;font-weight:800;flex:none;font-family:var(--fh)}
  .p em{font-style:normal;font-size:.77rem;color:var(--mut);font-weight:600}
  .empty{font-size:.82rem;color:var(--mut);padding:3px 0}

  /* ═══ 顺延 ═══ */
  .pend{margin:28px 16px 0;background:var(--card);border-radius:19px;padding:18px 19px;
    box-shadow:0 3px 14px rgba(51,48,43,.07);border:2px dashed var(--line)}
  .pend h3{font-size:1rem;margin-bottom:3px;color:var(--navy)}
  .pend .s{font-size:.77rem;color:var(--mut);margin-bottom:12px}
  .pend li{list-style:none;font-size:.85rem;padding:8px 0;border-top:1px solid var(--line);color:#6E6357}
  .pend li b{color:var(--ink);font-weight:700}

  .foot{text-align:center;font-size:.75rem;color:#B0A597;margin-top:30px;line-height:1.9;padding:0 20px}

  /* ═══ 弹窗 / 提示 ═══ */
  .veil{position:fixed;inset:0;background:rgba(14,46,77,.6);display:none;z-index:60;
    align-items:center;justify-content:center;padding:24px}
  .veil.on{display:flex}
  .box{background:var(--card);border-radius:24px;padding:28px 24px;width:100%;max-width:360px;
    box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .box .ic{font-size:2.4rem;text-align:center;margin-bottom:10px}
  .box h3{font-size:1.2rem;margin-bottom:7px;text-align:center}
  .box p{font-size:.84rem;color:var(--mut);margin-bottom:17px;line-height:1.65;text-align:center}
  .box input{width:100%;font-size:16px;font-family:var(--fz);border:2px solid var(--line);
    border-radius:13px;padding:13px;margin-bottom:14px;text-align:center;font-weight:700}
  .box input:focus{outline:none;border-color:var(--gold)}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(22px);
    background:rgba(22,69,111,.97);color:#fff;padding:14px 26px;border-radius:999px;
    font-size:.9rem;font-weight:700;z-index:90;opacity:0;transition:.26s;pointer-events:none;
    max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .load{text-align:center;padding:70px 24px;color:var(--mut);font-size:.9rem;line-height:1.8}

  /* 撒花 */
  .cf{position:fixed;pointer-events:none;z-index:80;width:9px;height:14px;border-radius:2px;top:-20px}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="page" id="page"><div class="load">正在载入课表…</div></div>

<div class="veil" id="veil">
  <div class="box">
    <div class="ic">⛵️</div>
    <h3 id="nameTitle">你是哪位？</h3>
    <p id="nameHint">填一次就好，这台手机会记住你。<br>这个名字会显示给同场的其他同学。</p>
    <input type="text" id="nameInput" placeholder="名字 / 英文名 / 昵称" maxlength="24">
    <button class="go" id="nameSave">好了</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var K = new URLSearchParams(location.search).get('k') || '';
  var LS_NAME='engo_yueka_name', LS_UID='engo_yueka_uid';
  var me='', uid='';
  try {
    me = localStorage.getItem(LS_NAME) || '';
    uid = localStorage.getItem(LS_UID) || '';
    if (!uid) {
      uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
      localStorage.setItem(LS_UID, uid);
    }
  } catch(e) { uid = 'u' + Math.random().toString(36).slice(2,14); }

  var D=null, openDate=null, pick={};
  var page=document.getElementById('page'), veil=document.getElementById('veil'), toastEl=document.getElementById('toast');

  // 每天一个主色，滚动起来不单调
  var ACC=['#2E7CC0','#E0703F','#5C9E4A','#C4820A','#7B5FC4','#2FA8A0','#D4506B'];
  var AV =['#3090D8','#EF4A4A','#7BA84A','#F4A81B','#8A63C4','#2FA8A0','#E07A3F','#5C7CB8'];
  function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
  function avColor(n){return AV[hash(n)%AV.length];}
  function initial(n){return (n||'?').trim().charAt(0).toUpperCase();}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  var tT;
  function toast(m){toastEl.textContent=m;toastEl.classList.add('on');
    clearTimeout(tT);tT=setTimeout(function(){toastEl.classList.remove('on');},2700);}

  function confetti(){
    var C=['#F4A81B','#EF4A4A','#7BA84A','#3090D8','#FFD275'];
    for(var i=0;i<26;i++){(function(i){
      var el=document.createElement('div');el.className='cf';
      el.style.left=(Math.random()*100)+'vw';
      el.style.background=C[i%C.length];
      el.style.animation='fall '+(1.5+Math.random()*1.1)+'s '+(Math.random()*.3)+'s ease-in forwards';
      document.body.appendChild(el);
      setTimeout(function(){el.remove();},3200);
    })(i);}
  }

  // ---------- 姓名 ----------
  function askName(first){
    document.getElementById('nameInput').value=me;
    document.getElementById('nameTitle').textContent=first?'你是哪位？':'换个名字';
    veil.classList.add('on');
    setTimeout(function(){document.getElementById('nameInput').focus();},80);
  }
  document.getElementById('nameSave').addEventListener('click',function(){
    var v=document.getElementById('nameInput').value.trim();
    if(!v){toast('填一下名字吧');return;}
    me=v; try{localStorage.setItem(LS_NAME,me);}catch(e){}
    veil.classList.remove('on'); render();
  });
  document.getElementById('nameInput').addEventListener('keydown',function(e){
    if(e.key==='Enter') document.getElementById('nameSave').click();
  });

  // ---------- 载入 ----------
  function api(){ return '/api/yueka?k='+encodeURIComponent(K)+'&u='+encodeURIComponent(uid); }
  function load(){
    fetch(api()).then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
      .then(function(x){
        if(x.s===403){page.innerHTML='<div class="load"><div style="font-size:3rem;margin-bottom:16px">🔒</div>'+
          '<b style="color:#33302B;font-size:1.06rem">这是月卡会员专属链接</b><br><br>'+
          '请向老师索取带口令的预约链接<br>微信 <b style="color:#16456F">engo2026</b></div>';return;}
        if(!x.j.ok) throw new Error(x.j.error||'fail');
        D=x.j; if(!me) askName(true); render();
      })
      .catch(function(){page.innerHTML='<div class="load">载入失败了，下拉刷新重试。<br>一直不行请联系老师（微信 engo2026）。</div>';});
  }

  // ---------- 渲染 ----------
  function render(){
    if(!D) return;
    var mine=D.bookings.filter(function(b){return b.mine;});
    var future=mine.filter(function(b){return b.date>=D.today;});
    var target=25, pct=Math.min(100, Math.round(mine.length/target*100));

    var h='';
    h+='<div class="hd"><div class="row"><div>'+
       '<div class="t">月卡预约</div><div class="sub">'+esc(D.label)+' · 每节 60 分钟</div></div>'+
       '<button class="who" id="whoBtn">'+(me?esc(me):'设置名字')+' ✎</button></div>'+
       '<div class="hero"><div class="big"><b>'+mine.length+'</b><span>场已约'+
       (future.length?'　·　接下来还有 '+future.length+' 场':'')+'</span></div>'+
       '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
       '<div class="cap">本月共 25 个主题学习日，来得越多越划算 🚀</div></div></div>';

    h+='<div class="note">'+esc(D.note)+'<br>'+
       '<b>预约规则：</b>9/1–9/6 <span class="hl">首周不限</span>随时可约；'+
       '<b>9/14 起需提前 '+D.leadDays+' 天</b>（9/14 的课 9/11 仍可约，9/12 起关闭）。</div>';

    var last=null;
    D.days.forEach(function(d){
      var wk=weekKey(d.date);
      if(wk.key!==last){
        h+='<div class="wk"><b>'+wk.label+'</b><i></i><em>'+wk.tag+'</em></div>';
        last=wk.key;
      }
      h+=dayCard(d);
    });

    if(D.pending&&D.pending.length){
      h+='<div class="pend"><h3>顺延补足 · 另外 5 个主题</h3>'+
         '<div class="s">日期与时段会结合大家的时间统一安排，定了就加进来</div><ul>';
      D.pending.forEach(function(p){h+='<li><b>'+esc(p.en)+'</b> · '+esc(p.cn)+'</li>';});
      h+='</ul></div>';
    }
    h+='<div class="foot">英歌派 Engo Pro · 成人英语主题月卡<br>'+
       '有问题随时微信 engo2026<br>普宁市万泰新天地时代中心 D 栋</div>';

    page.innerHTML=h;
    document.getElementById('whoBtn').addEventListener('click',function(){askName(false);});
    bind();
  }

  function weekKey(ds){
    var d=new Date(ds+'T00:00:00');
    var mon=new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7));
    var sun=new Date(mon); sun.setDate(mon.getDate()+6);
    var f=function(x){return (x.getMonth()+1)+'/'+x.getDate();};
    var days=D.days.filter(function(x){
      var t=new Date(x.date+'T00:00:00'); return t>=mon&&t<=sun;});
    var open=days.filter(function(x){return !x.break;}).length;
    return {key:f(mon), label:f(mon)+' – '+f(sun),
            tag: open? open+' 个主题日' : '休课周'};
  }

  function dayCard(d){
    var WD=['周日','周一','周二','周三','周四','周五','周六'];
    var dt=new Date(d.date+'T00:00:00');
    var bs=D.bookings.filter(function(b){return b.date===d.date;});
    var myBk=bs.filter(function(b){return b.mine;});
    var ac=ACC[hash(d.en)%ACC.length];

    var cls='day';
    if(d.break) cls+=' br'; else if(!d.state.open) cls+=' shut';
    if(myBk.length) cls+=' on';
    if(openDate===d.date) cls+=' open';

    var h='<div class="'+cls+'" data-date="'+d.date+'" style="--ac:'+ac+'">';
    h+='<div class="dh" data-toggle="'+d.date+'">';
    h+='<div class="dt"><div class="n">'+dt.getDate()+'</div><div class="w">'+WD[dt.getDay()]+'</div></div>';
    h+='<div class="dc"><div class="en">'+esc(d.en)+'</div>';
    if(d.cn) h+='<div class="cn">'+esc(d.cn)+'</div>';

    h+='<div class="meta">';
    if(d.break){ h+='<span class="pill shut">☕ 休课</span>'; }
    else if(!d.state.open){ h+='<span class="pill shut">'+esc(d.state.text)+'</span>'; }
    else{
      (d.slots||[]).forEach(function(s){
        h+='<span class="pill time">'+esc(D.slots[s].name)+' '+esc(D.slots[s].time)+'</span>';});
      if(d.state.reason==='grace') h+='<span class="pill grace">首周不限</span>';
    }
    if(!d.break&&bs.length){
      h+='<span class="heat">'+(bs.length>=3?'🔥':'🙋')+' '+bs.length+' 人'+
         '<span class="stack">'+bs.slice(0,4).map(function(b){
           return '<span class="m" style="background:'+avColor(b.name)+'">'+esc(initial(b.name))+'</span>';
         }).join('')+'</span></span>';
    }
    if(myBk.length){
      h+='<span class="pill me">✓ 你约了 '+myBk.map(function(b){return D.slots[b.slot].name;}).join(' + ')+'</span>';
    }
    h+='</div></div>';
    if(!d.break) h+='<div class="caret">›</div>';
    h+='</div>';

    if(!d.break){
      h+='<div class="bd">';
      if(d.state.open){
        var sel=pick[d.date]||{};
        var curSlot=sel.slot||(myBk[0]?myBk[0].slot:(d.slots[0]||''));
        var curBk=myBk.filter(function(b){return b.slot===curSlot;})[0];
        var curSt=sel.status!==undefined?sel.status:(curBk?curBk.status:'');

        h+='<div class="lb">选时段 <span>· 一天想来两场也可以</span></div><div class="opts">';
        d.slots.forEach(function(s){
          var booked=myBk.filter(function(b){return b.slot===s;}).length>0;
          h+='<button class="opt'+(curSlot===s?' sel':'')+'" data-slot="'+d.date+'|'+s+'">'+
             esc(D.slots[s].name)+(booked?' ✓':'')+'<small>'+esc(D.slots[s].time)+'</small></button>';
        });
        h+='</div>';
        if(d.slots.length>1) h+='<div class="tip">💡 同一天两场<b>内容完全一样</b>，来一场就够；想加练也可以两场都约。</div>';

        h+='<div class="lb">今天想练什么？ <span>· 老师上课前会看到</span></div><div class="opts">';
        D.statuses.forEach(function(st){
          h+='<button class="opt st'+(curSt===st.key?' sel':'')+'" data-st="'+d.date+'|'+st.key+'">'+
             st.emoji+' '+esc(st.label)+'</button>';
        });
        h+='</div>';
        h+='<button class="go" data-book="'+d.date+'">'+(curBk?'更新这一场':'约 '+D.slots[curSlot].name)+'</button>';
        if(curBk) h+='<button class="go cancel" data-cancel="'+d.date+'">取消我的 '+D.slots[curSlot].name+'</button>';
      } else {
        h+='<div class="empty">'+esc(d.state.text)+'，看看谁已经约了 👇</div>';
      }
      h+=peopleBlock(d,bs);
      h+='</div>';
    }
    return h+'</div>';
  }

  function peopleBlock(d,bs){
    var h='<div class="ppl">';
    if(!bs.length) return h+'<div class="empty">还没有人约这一天 —— 你可以是第一个 🌱</div></div>';
    (d.slots||[]).forEach(function(s){
      var list=bs.filter(function(b){return b.slot===s;});
      h+='<div class="grp"><div class="gt">'+esc(D.slots[s].name)+
         ' <em>'+esc(D.slots[s].time)+' · '+list.length+' 人</em></div>';
      if(!list.length){h+='<div class="empty">暂时没有人</div></div>';return;}
      h+='<div class="chips">';
      list.forEach(function(b){
        var st=D.statuses.filter(function(x){return x.key===b.status;})[0];
        h+='<span class="p'+(b.mine?' self':'')+'">'+
           '<span class="av" style="background:'+avColor(b.name)+'">'+esc(initial(b.name))+'</span>'+
           esc(b.name)+(st?' <em>'+st.emoji+' '+esc(st.label)+'</em>':'')+'</span>';
      });
      h+='</div></div>';
    });
    return h+'</div>';
  }

  // ---------- 交互 ----------
  function bind(){
    page.querySelectorAll('[data-toggle]').forEach(function(el){
      el.addEventListener('click',function(){
        var ds=el.getAttribute('data-toggle');
        var d=D.days.filter(function(x){return x.date===ds;})[0];
        if(d.break) return;
        openDate=(openDate===ds)?null:ds; render();
        if(openDate){var n=page.querySelector('[data-date="'+openDate+'"]');
          if(n) n.scrollIntoView({behavior:'smooth',block:'center'});}
      });
    });
    page.querySelectorAll('[data-slot]').forEach(function(el){
      el.addEventListener('click',function(){
        var p=el.getAttribute('data-slot').split('|');
        pick[p[0]]={slot:p[1]};   // 换时段时状态跟着那一场重新取
        render();
      });
    });
    page.querySelectorAll('[data-st]').forEach(function(el){
      el.addEventListener('click',function(){
        var p=el.getAttribute('data-st').split('|');
        var cur=pick[p[0]]||{};
        var d=D.days.filter(function(x){return x.date===p[0];})[0];
        var slot=cur.slot||(D.bookings.filter(function(b){return b.date===p[0]&&b.mine;})[0]||{}).slot||d.slots[0];
        pick[p[0]]={slot:slot, status: cur.status===p[1] ? '' : p[1]};
        render();
      });
    });
    page.querySelectorAll('[data-book]').forEach(function(el){
      el.addEventListener('click',function(){go(el.getAttribute('data-book'),false,el);});
    });
    page.querySelectorAll('[data-cancel]').forEach(function(el){
      el.addEventListener('click',function(){go(el.getAttribute('data-cancel'),true,el);});
    });
  }

  function go(date,cancel,btn){
    if(!me){askName(true);return;}
    var d=D.days.filter(function(x){return x.date===date;})[0];
    var sel=pick[date]||{};
    var myBk=D.bookings.filter(function(b){return b.date===date&&b.mine;});
    var slot=sel.slot||(myBk[0]?myBk[0].slot:(d.slots[0]||''));
    var cur=myBk.filter(function(b){return b.slot===slot;})[0];
    var status=sel.status!==undefined?sel.status:(cur?cur.status:'');

    var body={k:K,u:uid,date:date,slot:slot};
    if(cancel) body.action='cancel'; else {body.name=me;body.status=status;}

    btn.disabled=true; var old=btn.textContent; btn.textContent='处理中…';
    fetch('/api/yueka',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json();})
      .then(function(j){
        if(!j.ok) throw new Error(j.error||'失败');
        if(cancel){ toast('已取消 '+D.slots[slot].name); }
        else { toast('约好啦，'+D.slots[slot].name+' 见 👋'); confetti(); }
        delete pick[date];
        return fetch(api()).then(function(r){return r.json();})
          .then(function(n){if(n.ok){D=n;render();}});
      })
      .catch(function(e){btn.disabled=false;btn.textContent=old;toast(e.message||'操作失败，请重试');});
  }

  load();
})();
</script>
</body>
</html>
