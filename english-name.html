<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>英文名小屋 · English Name Studio | 英歌宝 Engo Baby</title>
<meta name="description" content="英歌宝 Engo Baby — 根据孩子的中文名与性格，现场为宝贝挑选一个好听又有寓意的英文名。">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#EF4A4A; --yellow:#F4A81B; --green:#7BA84A; --blue:#3090D8;
    --blue-d:#1F6FB0; --ink:#2B3A4A; --cream:#F7F3EC; --sand:#C9B79C;
    --sky:#EAF5FD; --white:#fff;
    --shadow:0 10px 30px rgba(31,111,176,.12);
    --radius:22px;
    --fz:"Poppins","Noto Sans SC",system-ui,sans-serif;
    --fh:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--fz);color:var(--ink);background:linear-gradient(170deg,var(--sky),#fff 55%);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
  h1,h2,h3,.brandfont{font-family:var(--fh);line-height:1.2}
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  .btn{display:inline-block;background:var(--red);color:#fff;font-weight:700;padding:14px 30px;border-radius:99px;box-shadow:0 8px 18px rgba(239,74,74,.32);transition:transform .15s, box-shadow .15s;border:none;cursor:pointer;font-size:1.05rem;font-family:var(--fz)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(239,74,74,.4)}
  .btn:active{transform:translateY(0)}
  .btn.blue{background:var(--blue);box-shadow:0 8px 18px rgba(48,144,216,.32)}
  .btn.green{background:var(--green);box-shadow:0 8px 18px rgba(123,168,74,.32)}
  .btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);box-shadow:none}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

  /* header */
  header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid #eef1f4}
  nav{display:flex;align-items:center;justify-content:space-between;height:66px}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:800;font-size:1.25rem;color:var(--ink)}
  .logo img{height:46px}
  .backlink{font-weight:600;font-size:.92rem;color:var(--blue)}

  /* hero */
  .hero{text-align:center;padding:38px 0 8px}
  .eyebrow{display:inline-block;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.74rem;color:var(--blue);background:var(--sky);padding:6px 16px;border-radius:99px;margin-bottom:14px}
  .hero h1{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800;color:var(--blue-d)}
  .hero h1 .pop{color:var(--red)}
  .hero p{font-size:1.08rem;color:#5b6b7a;max-width:560px;margin:12px auto 0}

  /* card panel */
  .panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 30px 34px;margin:26px auto 40px}
  .step-title{font-family:var(--fh);font-weight:800;font-size:1.2rem;color:var(--ink);display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .step-title .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.95rem}
  .step-sub{color:#8a98a4;font-size:.92rem;margin-bottom:18px;margin-left:40px}
  .field{margin-bottom:26px}
  .name-input{width:100%;max-width:320px;font-family:var(--fz);font-size:1.25rem;font-weight:600;color:var(--ink);border:2px solid #e3e9ef;border-radius:16px;padding:14px 18px;outline:none;transition:border .2s;text-align:center;letter-spacing:.15em}
  .name-input:focus{border-color:var(--blue)}
  .name-input::placeholder{color:#c2ccd4;font-weight:400;letter-spacing:normal}
  .py-hint{margin-top:8px;color:var(--green);font-size:.9rem;font-weight:600;min-height:20px}

  .gender-row{display:flex;gap:12px;flex-wrap:wrap}
  .gender-btn{flex:1;min-width:110px;background:var(--cream);border:2px solid transparent;border-radius:16px;padding:16px;font-family:var(--fh);font-weight:700;font-size:1.05rem;color:var(--ink);cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:8px}
  .gender-btn .em{font-size:1.4rem}
  .gender-btn.on{background:var(--sky);border-color:var(--blue);color:var(--blue-d);box-shadow:0 6px 14px rgba(48,144,216,.18)}

  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:var(--cream);border:2px solid transparent;border-radius:99px;padding:10px 16px;font-weight:600;font-size:.98rem;color:var(--ink);cursor:pointer;transition:all .16s;display:flex;align-items:center;gap:7px;user-select:none}
  .chip .em{font-size:1.15rem}
  .chip.on{background:#FFF3D6;border-color:var(--yellow);color:#8a6410}
  .chip:active{transform:scale(.96)}

  .go-row{text-align:center;margin-top:30px}
  .go-hint{color:#a7b2bc;font-size:.85rem;margin-top:12px}

  /* results */
  #results{display:none}
  .result-head{text-align:center;margin:6px 0 4px}
  .result-head h2{font-family:var(--fh);font-weight:800;font-size:1.5rem;color:var(--blue-d)}
  .result-head p{color:#7a8894;font-size:.95rem;margin-top:4px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin:24px 0 8px}
  .ncard{background:#fff;border-radius:20px;border:1px solid #eef2f5;box-shadow:var(--shadow);padding:24px 22px 22px;display:flex;flex-direction:column;position:relative;transition:transform .18s, box-shadow .18s;animation:pop .35s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .ncard:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(31,111,176,.18)}
  .ncard .gtag{position:absolute;top:16px;right:16px;font-size:1.15rem}
  .ncard .en-name{font-family:var(--fh);font-weight:800;font-size:2.05rem;color:var(--blue-d);line-height:1.1}
  .ncard .pron{color:#8a98a4;font-size:.95rem;margin-top:2px;font-weight:600}
  .ncard .badges{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 12px}
  .ncard .badge{font-size:.76rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--sky);color:var(--blue-d)}
  .ncard .badge.py{background:#EAF7E4;color:#4e7a1f}
  .ncard .reason{color:#5b6b7a;font-size:.92rem;line-height:1.6;flex:1}
  .ncard .pick{margin-top:16px;width:100%;background:var(--green);color:#fff;border:none;border-radius:14px;padding:12px;font-family:var(--fh);font-weight:700;font-size:1rem;cursor:pointer;transition:transform .15s, box-shadow .15s;box-shadow:0 6px 14px rgba(123,168,74,.28)}
  .ncard .pick:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(123,168,74,.4)}
  .actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:22px}

  /* chosen overlay */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(31,111,176,.28);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.on{display:flex;animation:fade .3s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .cert{background:#fff;border-radius:26px;max-width:460px;width:100%;padding:40px 34px 34px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.28);position:relative;animation:rise .4s cubic-bezier(.2,.8,.3,1.2) both}
  @keyframes rise{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
  .cert .mascot{height:70px;margin:0 auto 6px}
  .cert .congrat{color:#8a98a4;font-size:.98rem}
  .cert .big{font-family:var(--fh);font-weight:800;font-size:3rem;color:var(--red);margin:8px 0 2px;line-height:1.05}
  .cert .cpron{color:#8a98a4;font-weight:600;margin-bottom:14px}
  .cert .cmean{background:var(--cream);border-radius:16px;padding:14px 18px;color:#5b6b7a;font-size:.95rem;margin-bottom:8px}
  .cert .cwhy{color:#6b7a88;font-size:.9rem;line-height:1.6;margin-bottom:22px}
  .cert .cbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .cert .brand{margin-top:20px;color:#b6c0c8;font-size:.8rem;font-family:var(--fh);font-weight:700;letter-spacing:.05em}
  .confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:99;pointer-events:none;border-radius:2px}

  footer{text-align:center;padding:24px;color:#a7b2bc;font-size:.85rem}

  @media(max-width:600px){
    .panel{padding:24px 18px 28px}
    .gender-btn{min-width:calc(50% - 6px)}
    .cert .big{font-size:2.5rem}
  }
</style>
</head>
<body>
<header>
  <nav class="wrap">
    <a href="index.html" class="logo"><img src="logo.png" alt="英歌宝 Engo Baby">英歌宝</a>
    <a href="index.html" class="backlink">← 返回官网</a>
  </nav>
</header>

<div class="hero wrap">
  <span class="eyebrow">English Name Studio</span>
  <h1>英文名<span class="pop">小屋</span> 🏡</h1>
  <p>告诉我们宝贝的中文名和小性格，我们来挑几个好听、好记、有寓意的英文名，让孩子自己选一个心爱的名字～</p>
</div>

<div class="wrap">
  <!-- INPUT -->
  <div class="panel" id="inputPanel">
    <div class="field">
      <div class="step-title"><span class="n">1</span>宝贝的中文名</div>
      <div class="step-sub">用来挑选发音相近的英文名（可留空）</div>
      <input class="name-input" id="childName" placeholder="例如：梓涵" maxlength="6" autocomplete="off">
      <div class="py-hint" id="pyHint"></div>
    </div>

    <div class="field">
      <div class="step-title"><span class="n">2</span>是男孩还是女孩</div>
      <div class="step-sub">帮我们缩小合适的名字范围</div>
      <div class="gender-row" id="genderRow">
        <button class="gender-btn" data-g="f"><span class="em">👧</span>女孩</button>
        <button class="gender-btn" data-g="m"><span class="em">👦</span>男孩</button>
        <button class="gender-btn" data-g=""><span class="em">✨</span>都看看</button>
      </div>
    </div>

    <div class="field" style="margin-bottom:0">
      <div class="step-title"><span class="n">3</span>宝贝的小性格</div>
      <div class="step-sub">选 1–3 个最像 TA 的（可不选）</div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="go-row">
      <button class="btn" id="goBtn">✨ 开始取名字</button>
      <div class="go-hint" id="goHint">选好性别后点这里～</div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="panel" id="results">
    <div class="result-head">
      <h2 id="resultTitle">为宝贝挑了这几个 💫</h2>
      <p id="resultSub"></p>
    </div>
    <div class="cards" id="cards"></div>
    <div class="actions">
      <button class="btn ghost" id="reshuffle">↻ 换一批</button>
      <button class="btn blue" id="restart">← 重新填写</button>
    </div>
  </div>
</div>

<!-- CHOSEN OVERLAY -->
<div class="overlay" id="overlay">
  <div class="cert">
    <img src="mascot.png" class="mascot" alt="" onerror="this.style.display='none'">
    <div class="congrat">🎉 恭喜 <b id="certChild">宝贝</b> 有了自己的英文名！</div>
    <div class="big" id="certName">Emma</div>
    <div class="cpron" id="certPron"></div>
    <div class="cmean" id="certMean"></div>
    <div class="cwhy" id="certWhy"></div>
    <div class="cbtns">
      <button class="btn green" id="confirmName">就用这个名字 ♥</button>
      <button class="btn ghost" id="chooseAgain">再挑一个</button>
    </div>
    <div class="brand">英歌宝 Engo Baby · Play, Learn, Grow!</div>
  </div>
</div>

<footer>英歌宝 Engo Baby · 英文名小屋</footer>

const TRAIT_PHRASE = {lively:'活泼开朗',gentle:'温柔文静',brave:'勇敢自信',smart:'聪明机灵',curious:'充满好奇心',leader:'有领导力',kind:'善良有爱心',creative:'富有想象力',sunny:'阳光乐观',calm:'沉稳专注'};

const INITIALS = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
const SOUND_MAP = {
 b:['b'],p:['p','b'],m:['m'],f:['f'],d:['d'],t:['t'],n:['n'],l:['l'],
 g:['g'],k:['k'],h:['h'],j:['j','g'],q:['k'],x:['s','sh'],
 zh:['j','z'],ch:['ch','j'],sh:['sh','s'],r:['r'],z:['z','j'],c:['s','z'],s:['s'],
 y:['y','i','e','a'],w:['w','v'],
 a:['a'],e:['e'],o:['o'],i:['i'],u:['u']
};
function initialOf(py){ for(const i of INITIALS){ if(py.startsWith(i)) return i; } return py[0]; }
function soundInfoOf(name){
  const map={};
  for(const ch of name){ const py=PINYIN[ch]; if(!py) continue;
    const ini=initialOf(py);
    (SOUND_MAP[ini]||[]).forEach(s=>{ if(!(s in map)) map[s]=ch; });
  }
  return map;
}

  b.innerHTML='<span class="em">'+t.em+'</span>'+t.label;
  b.onclick=()=>{ if(traits.has(t.k)){traits.delete(t.k);b.classList.remove('on');} else {traits.add(t.k);b.classList.add('on');} };

});

const childNameEl=document.getElementById('childName');
const pyHint=document.getElementById('pyHint');
childNameEl.addEventListener('input',()=>{
  const v=childNameEl.value.trim();
  if(!v){ pyHint.textContent=''; return; }
  const py=[]; let known=0;
  for(const ch of v){ if(PINYIN[ch]){ py.push(PINYIN[ch]); known++; } else py.push('·'); }
  pyHint.textContent = known? ('拼音：'+py.join(' ')) : '';
});

function scoreOf(nm, si){
  let sc=0, phon=false, ch=null;
  nm.t.forEach(t=>{ if(traits.has(t)) sc+=3; });
  if(si && si[nm.s]!==undefined){ sc+=4; phon=true; ch=si[nm.s]; }
  return {sc,phon,ch};
}
function buildQueue(){
  const name=childNameEl.value.trim();
  const si = name? soundInfoOf(name) : null;
  let pool = NAMES.filter(n=> gender==='' || !gender ? true : n.g===gender);
  pool = pool.map(n=>{ const r=scoreOf(n,si); return Object.assign({},n,{_sc:r.sc,_phon:r.phon,_char:r.ch}); });
  pool.forEach(n=> n._rank = n._sc + Math.random()*2.4);
  pool.sort((a,b)=> b._rank - a._rank);
  queue=pool; qptr=0;
}
function reasonFor(nm){
  const matched = nm.t.filter(t=>traits.has(t)).map(t=>TRAIT_PHRASE[t]);
  const bits=[];
  bits.push('寓意「'+nm.m+'」');
  if(matched.length) bits.push('契合'+matched.slice(0,2).join('、')+'的性格');
  if(nm._phon && nm._char) bits.push('发音也和「'+nm._char+'」相呼应');
  return bits.join('，')+'。';
}
function cardHTML(nm){
  const g = nm.g==='f'?'👧':'👦';
  const matched = nm.t.filter(t=>traits.has(t));
  let badges='';
  if(nm._phon && nm._char) badges += '<span class="badge py">谐音「'+nm._char+'」</span>';
  matched.slice(0,2).forEach(t=> badges += '<span class="badge">'+TRAIT_PHRASE[t]+'</span>');
  return '<div class="ncard">'
    +'<span class="gtag">'+g+'</span>'
    +'<div class="en-name">'+nm.n+'</div>'
    +'<div class="pron">'+nm.zh+'</div>'
    +'<div class="badges">'+badges+'</div>'
    +'<div class="reason">'+reasonFor(nm)+'</div>'
    +'<button class="pick" data-n="'+nm.n+'">选这个 ♥</button>'
    +'</div>';
}
function renderBatch(){
  if(qptr>=queue.length){ // wrap + reshuffle for freshness
    queue.forEach(n=> n._rank = n._sc + Math.random()*2.4);
    queue.sort((a,b)=> b._rank - a._rank); qptr=0;
  }
  current = queue.slice(qptr, qptr+batch);
  if(current.length<batch){ current = current.concat(queue.slice(0, batch-current.length)); }
  const cardsEl=document.getElementById('cards');
  cardsEl.innerHTML = current.map(cardHTML).join('');
  cardsEl.querySelectorAll('.pick').forEach(btn=>{
    btn.onclick=()=>{ const nm=current.find(x=>x.n===btn.dataset.n); showChosen(nm); };
  });
  // subtitle
  const name=childNameEl.value.trim();
  const parts=[];
  if(gender==='f') parts.push('女孩'); else if(gender==='m') parts.push('男孩');
  if(traits.size) parts.push([...traits].map(k=>TRAIT_PHRASE[k]).slice(0,3).join('·'));
  document.getElementById('resultSub').textContent = (name? name+' · ':'') + parts.join(' · ');
}

goBtn.onclick=()=>{
  buildQueue(); renderBatch();
  document.getElementById('inputPanel').style.display='none';
  document.getElementById('results').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
};
document.getElementById('reshuffle').onclick=()=>{ qptr+=batch; renderBatch(); };
document.getElementById('restart').onclick=()=>{
  document.getElementById('results').style.display='none';
  document.getElementById('inputPanel').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
};

// chosen overlay
const overlay=document.getElementById('overlay');
function showChosen(nm){
  document.getElementById('certChild').textContent = childNameEl.value.trim() || '宝贝';
  document.getElementById('certName').textContent = nm.n;
  document.getElementById('certPron').textContent = nm.zh + ' · ' + (nm.g==='f'?'女孩名 👧':'男孩名 👦');
  document.getElementById('certMean').innerHTML = '💡 寓意：<b>'+nm.m+'</b>';
  document.getElementById('certWhy').textContent = reasonFor(nm);
  overlay.classList.add('on');
  burstConfetti();
}
document.getElementById('chooseAgain').onclick=()=> overlay.classList.remove('on');
document.getElementById('confirmName').onclick=()=>{
  const b=document.getElementById('confirmName');
  b.textContent='已选定！记得告诉老师哦 ✓'; b.disabled=true;
  setTimeout(()=>{ overlay.classList.remove('on'); b.textContent='就用这个名字 ♥'; b.disabled=false; },1600);
};
overlay.onclick=(e)=>{ if(e.target===overlay) overlay.classList.remove('on'); };

function burstConfetti(){
  const colors=['#EF4A4A','#F4A81B','#7BA84A','#3090D8'];
  for(let i=0;i<28;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=(Math.random()*100)+'vw';
    c.style.background=colors[i%colors.length];
    c.style.transform='rotate('+(Math.random()*360)+'deg)';
    document.body.appendChild(c);
    const dur=1400+Math.random()*1000;
    c.animate([{transform:c.style.transform+' translateY(0)',opacity:1},
               {transform:'rotate('+(Math.random()*720)+'deg) translateY(105vh)',opacity:.9}],
              {duration:dur,easing:'cubic-bezier(.3,.7,.5,1)'});
    setTimeout(()=>c.remove(),dur);
  }
}
</script>
